name: Importador de produtos
on:
  push:
    paths:
      - 'public/product-import.js'
      - 'src/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'docs/product-import.js'
      - 'docs/assets/index-product-import-*.js'
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/product-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/product-import.js
      - run: node --check worker/index.js
      - run: node --check worker/screenshot.js
      - run: node --check public/screenshot-import.js
      - run: node tests/screenshot.test.mjs
      - run: for f in docs/assets/index-*.js; do node --check "$f"; done
      - run: cmp public/product-import.js docs/product-import.js
      - run: node tests/product-import.test.mjs

      - run: npm ci
      - run: npm run build
